<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HazeFix</title>

<!--
  GEÇİCİ SAYFA. Kök adres (hazefix.org) şu an anasayfa değil, yalnızca yorum
  formuna yönlendiriyor. Yol haritasının 4. maddesi (anasayfa) yazıldığında bu
  dosyanın yerini gerçek anasayfa alacak ve yönlendirme kaldırılacak.

  Yönlendirme üç katmanlı, çünkü statik sitede sunucu tarafı yönlendirme yok:
  1. <meta refresh>  — JS kapalıysa da çalışır.
  2. location.replace — anında çalışır; "assign" DEĞİL, yoksa geri tuşu
     ziyaretçiyi bu sayfaya geri atar ve sonsuz döngüye benzer bir his verir.
  3. Görünür bağlantı — ikisi de engellenirse ziyaretçi elle tıklar.
-->
<meta http-equiv="refresh" content="0; url=/review/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="canonical" href="https://hazefix.org/review/">
<meta name="robots" content="noindex">

<style>
  /* Renkler /review/ ile aynı tek krem temadan geliyor: zemin --bg (#f5eee3),
     metin --text-main (#241d12), bağlantı --copper (#824b22). Ölçüldü:
     bağlantı zemin üzerinde 6.12:1, yani WCAG AA (4.5) geçiyor.
     Zemin 2026-09-07'de #e6d3b3 -> #f1e8d7 -> #f5eee3 diye açıldı;
     kontrast 4.81'den 6.12'ye çıktı.
     Form paleti değişirse buradaki üç sabit de elle güncellenmeli — bu sayfa
     ortak bir CSS dosyası kullanmıyor (anasayfa yazılınca zaten değişecek).

     color-scheme: light (light dark DEĞİL) — site tek temalı; ikisi birden
     bırakılırsa işletim sistemi koyu temadayken kaydırma çubuğu gibi native
     kontroller koyu boyanıp bej zeminde yabancı duruyor. */
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5eee3;
    color: #241d12;
    font: 400 15px/1.6 "Quicksand", system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
  }
  a { color: #824b22; }
</style>
</head>
<body>
  <p>Yorum formuna yönlendiriliyorsunuz — <a href="/review/">yönlenmezseniz buraya tıklayın</a>.</p>
  <script>
    location.replace("/review/");
  </script>
</body>
</html>
