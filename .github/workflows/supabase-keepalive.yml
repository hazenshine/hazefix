# Supabase Free plan, 7 gün hiç istek almayan projeyi otomatik duraklatıyor.
# Sitenin trafiği olmadığı için duraklama kaçınılmaz; bu iş her gün tabloya
# küçük bir okuma yaparak projeyi uyanık tutuyor.
#
# Aşağıdaki apikey bir sır DEĞİL: publishable (anon) key, index.html içinde
# zaten herkese açık ve siteyi açan her tarayıcı indiriyor. Koruma RLS'te.
#
# NOT: GitHub, 60 gün commit almayan public repolarda zamanlanmış workflow'ları
# otomatik devre dışı bırakır (önce uyarı e-postası atar, tek tıkla geri açılır).
# Bu yüzden asıl keepalive katmanı cron-job.org; burası yedek.

name: Supabase keepalive

on:
  schedule:
    # Her gün 06:17 UTC. Tam saat başları GitHub'da yoğun olduğu ve
    # zamanlanmış işler gecikebildiği için bilinçli olarak ofsetli.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase REST'e ping at
        run: |
          set -euo pipefail
          code=$(curl -sS \
            --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o /tmp/body.txt -w '%{http_code}' \
            'https://qnwolrpfbfepghpbyayc.supabase.co/rest/v1/reviews?select=id&limit=1' \
            -H 'apikey: sb_publishable_3CTlSNBvufygcUI3xqXObg_Nn039a1s')
          echo "HTTP $code"
          echo "Yanit govdesi: $(cat /tmp/body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Keepalive basarisiz (HTTP $code). Proje duraklamis ya da anahtar/tablo degismis olabilir."
            exit 1
          fi
          echo "Proje ayakta."
